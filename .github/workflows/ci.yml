name: CI

# AWS の権限は付けない（id-token なし）。フォークからのプルリクエストでも安全に動く（NFR5.6）。
# deploy-staging.yml / deploy-production.yml は、この検査をそのまま呼び出して使う。
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 検査するコミット（空なら呼び出したときのコミット）
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.ref }}
        with:
          persist-credentials: false

      - name: 検査スクリプトを退避
        if: ${{ inputs.ref }}
        run: cp scripts/check-ci.sh "$RUNNER_TEMP/housework-check-ci.sh"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存の取り込み
        run: npm ci

      - name: Gitleaks の取り込み
        working-directory: ${{ runner.temp }}
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --remote-name "${release}/${archive}"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$PWD/gitleaks-bin" >> "$GITHUB_PATH"

      - name: CI と同じ検査
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$CHECKOUT_REF" ]; then
            bash "$RUNNER_TEMP/housework-check-ci.sh"
          else
            npm run check:ci
          fi
